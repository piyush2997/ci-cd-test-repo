apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-cd-test-repo
  namespace: ci-cd-test
  labels:
    app: ci-cd-test-repo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ci-cd-test-repo
  template:
    metadata:
      labels:
        app: ci-cd-test-repo
    spec:
      containers:
        - name: ci-cd-test-repo
          image: ci-cd-test-repo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: ci-cd-test-repo
  namespace: ci-cd-test
spec:
  type: ClusterIP
  selector:
    app: ci-cd-test-repo
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP